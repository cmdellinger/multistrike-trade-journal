<h1 mat-dialog-title>Add Trade Data</h1>
<div mat-dialog-content>
    <form [formGroup]="form">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Trade ID</mat-label>
                <input matInput formControlName="id" readonly>
                <mat-hint>Auto-generated</mat-hint>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Action</mat-label>
                <mat-select formControlName="action">
                    <mat-option value="buy">Buy</mat-option>
                    <mat-option value="sell">Sell</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Date</mat-label>
                <input matInput formControlName="date" placeholder="YYYY-MM-DD">
                <mat-icon matPrefix>calendar_today</mat-icon>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Time</mat-label>
                <input matInput formControlName="time" placeholder="HH:MM:SS">
                <mat-icon matPrefix>access_time</mat-icon>
            </mat-form-field>
        </div>
        <mat-form-field appearance="outline">
            <mat-label>Ticker Symbol</mat-label>
            <input matInput formControlName="ticker" placeholder="e.g., AAPL, MSFT">
            <mat-icon matPrefix>trending_up</mat-icon>
        </mat-form-field>
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Quantity</mat-label>
                <input matInput formControlName="quantity" type="number" placeholder="0">
                <mat-icon matPrefix>format_list_numbered</mat-icon>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Price</mat-label>
                <input matInput formControlName="price" type="number" placeholder="0.00">
                <mat-icon matPrefix>attach_money</mat-icon>
            </mat-form-field>
        </div>
    </form>
</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="submitData()" [disabled]="!form.valid">Submit Trade</button>
</div>
